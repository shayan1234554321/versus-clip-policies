<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versus Clip — Legal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.7;
      color: #1a1a1a;
      background: #0D0D0F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0D0D0F;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0D0D0F;
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    a {
      display: block;
      padding: 1rem;
      background: #0D0D0F;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    a:hover {
      background: #1a1a2e;
    }

    .alt-link {
      background: transparent;
      border: 2px solid #0D0D0F;
      color: #0D0D0F;
    }

    .alt-link:hover {
      background: #f5f5f5;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #aaa;
    }

    @media (max-width: 500px) {
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">VERSUS CLIP</div>
    <div class="tagline">Social Gaming Mobile App</div>
    <h1>Legal Documents</h1>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
      <a href="child-safety.html">Child Safety Policy</a>
    </div>
    <footer">&copy; 2026 Versus Clip. All rights reserved.</footer>
  </div>
</body>
</html>
